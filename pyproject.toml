[project]
name = "redsho"
version = "0.1.2"
description = "Robust evolutionary direction set hyperparameter optimizer"
readme = "README.md"
authors = [
    { name = "Brandon Rohrer", email = "brohrer@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 80
